services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: emplowise:latest
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      # Production overrides. Everything else comes from .env
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: warning
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    volumes:
      - emplowise-db:/var/www/html/database
      - emplowise-storage:/var/www/html/storage
    restart: unless-stopped

volumes:
  emplowise-db:
  emplowise-storage:

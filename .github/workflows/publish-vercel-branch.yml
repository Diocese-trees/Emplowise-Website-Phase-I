name: Publish the Vercel build branch

# Vercel's Git integration builds on Vercel's own machines, which have no PHP.
# So the rendered site is committed to a dedicated branch and Vercel is pointed
# at that branch: every push to main republishes it, and Vercel deploys it as
# static files without building anything.
#
# Dormant until the repository variable VERCEL_BRANCH_ENABLED is "true". Use
# either this workflow or deploy-vercel.yml, not both.
# See docs/VERCEL.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-vercel-branch
  cancel-in-progress: true

jobs:
  publish:
    if: vars.VERCEL_BRANCH_ENABLED == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, curl, openssl, tokenizer, xml, ctype, json
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev --optimize-autoloader

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          mkdir -p storage/framework/cache storage/framework/views bootstrap/cache

      - name: Render the static site
        env:
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          STATIC_BASE_URL: ${{ vars.STATIC_BASE_URL }}
        run: |
          if [ -z "${STATIC_BASE_URL}" ]; then
            echo "::error::Set the repository variable STATIC_BASE_URL to the Vercel production URL, for example https://emplowise.com."
            exit 1
          fi
          if [ -z "${WEB3FORMS_ACCESS_KEY}" ]; then
            echo "::error::Add a WEB3FORMS_ACCESS_KEY repository secret so the free HR audit form can send."
            exit 1
          fi
          php artisan emplowise:export-static build/static \
            --base="${STATIC_BASE_URL}" \
            --audit-key="${WEB3FORMS_ACCESS_KEY}"

      - name: Attach the Vercel routing rules
        run: |
          cp vercel.json build/static/vercel.json

      - name: Check the export before publishing
        env:
          STATIC_BASE_URL: ${{ vars.STATIC_BASE_URL }}
        run: |
          set -eu
          for file in index.html 404.html robots.txt sitemap.xml vercel.json; do
            if [ ! -s "build/static/${file}" ]; then
              echo "::error::build/static/${file} is missing or empty."
              exit 1
            fi
          done
          if [ ! -s "build/static/why-emplowise/index.html" ]; then
            echo "::error::The export is missing rendered pages."
            exit 1
          fi
          if [ ! -s "build/static/downloads/Emplowise-Brand-Kit-2026.docx" ]; then
            echo "::error::The downloads folder did not copy."
            exit 1
          fi
          if grep -rIl --exclude-dir=downloads "127.0.0.1\|localhost" build/static >/dev/null 2>&1; then
            echo "::error::The export contains a localhost URL. Check STATIC_BASE_URL."
            exit 1
          fi
          if grep -rIl --include='*.html' "data-audit-nokey" build/static >/dev/null 2>&1; then
            echo "::error::The audit form was exported inert. Check WEB3FORMS_ACCESS_KEY."
            exit 1
          fi
          echo "Export looks consistent for ${STATIC_BASE_URL}."

      - name: Publish to the vercel-static branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cd build/static
          # .nojekyll is a GitHub Pages artefact and means nothing to Vercel.
          rm -f .nojekyll
          printf 'Rendered by .github/workflows/publish-vercel-branch.yml.\nDo not edit by hand: the next push to main replaces this branch.\n' > README.txt
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Render ${GITHUB_SHA:0:7} for Vercel"
          # Force push keeps the branch at a single commit, so it never grows.
          git push --force --quiet \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:vercel-static
